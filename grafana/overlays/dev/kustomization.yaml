apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
- ../../base

# ── Route hostname ─────────────────────────────────────────────────────────────
# Set the Route hostname explicitly so oauth-redirectreference resolves to a
# stable URL. Replace with your actual dev cluster wildcard domain.
patches:
- target:
    kind: Route
    name: grafana
  patch: |-
    - op: add
      path: /spec/hostname
      value: grafana.apps.dev.CLUSTER_DOMAIN

# ── Grafana root_url ───────────────────────────────────────────────────────────
# Inject root_url via env var so the ConfigMap does not need to be forked per env.
- target:
    kind: Deployment
    name: grafana
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: GF_SERVER_ROOT_URL
        value: https://grafana.apps.dev.CLUSTER_DOMAIN/

# ── Image versions ─────────────────────────────────────────────────────────────
# Use the same image tags as base for dev. Pin to digests in prod overlay.
images:
- name: grafana/grafana
  newTag: "10.4.3"
- name: quay.io/openshift/origin-oauth-proxy
  newTag: "4.15"

# ── Resource scaling ───────────────────────────────────────────────────────────
# Lower resource limits for dev clusters with constrained capacity.
- target:
    kind: Deployment
    name: grafana
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "250m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "256Mi"

# ── PVC size ───────────────────────────────────────────────────────────────────
- target:
    kind: PersistentVolumeClaim
    name: grafana-data
  patch: |-
    - op: replace
      path: /spec/resources/requests/storage
      value: "2Gi"
