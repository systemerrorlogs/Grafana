apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
- ../../base

# ── Route hostname ─────────────────────────────────────────────────────────────
patches:
- target:
    kind: Route
    name: grafana
  patch: |-
    - op: add
      path: /spec/hostname
      value: grafana.apps.prod.CLUSTER_DOMAIN

# ── Grafana root_url ───────────────────────────────────────────────────────────
- target:
    kind: Deployment
    name: grafana
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: GF_SERVER_ROOT_URL
        value: https://grafana.apps.prod.CLUSTER_DOMAIN/

# ── Image versions (pin to digest in production) ───────────────────────────────
# Replace newTag with newDigest for immutable references, e.g.:
#   newDigest: sha256:abc123...
# Run: skopeo inspect docker://grafana/grafana:10.4.3 | jq -r '.Digest'
images:
- name: grafana/grafana
  newTag: "10.4.3"
- name: quay.io/openshift/origin-oauth-proxy
  newTag: "4.15"

# ── Storage class ──────────────────────────────────────────────────────────────
# Specify the production storage class explicitly rather than relying on the
# cluster default. Common options: gp3-csi (AWS), managed-csi (Azure),
# ocs-storagecluster-ceph-rbd (ODF).
- target:
    kind: PersistentVolumeClaim
    name: grafana-data
  patch: |-
    - op: replace
      path: /spec/resources/requests/storage
      value: "10Gi"
    - op: add
      path: /spec/storageClassName
      value: "REPLACE_WITH_PROD_STORAGE_CLASS"

# ── Resource limits (production sizing) ───────────────────────────────────────
- target:
    kind: Deployment
    name: grafana
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "1000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "1Gi"
