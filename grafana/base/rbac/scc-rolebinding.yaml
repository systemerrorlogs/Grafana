apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-nonroot-scc
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # system:openshift:scc:nonroot is the auto-generated ClusterRole OCP creates
  # for every SCC. It grants "use" on the nonroot SCC to the bound subject.
  # This allows the grafana SA to run pods with any non-zero UID (including 472).
  # Do NOT use "oc adm policy add-scc-to-user" — declarative RoleBinding is
  # idempotent and GitOps-friendly.
  name: system:openshift:scc:nonroot
