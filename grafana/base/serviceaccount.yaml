apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: serviceaccount
  annotations:
    # Tells the OpenShift OAuth server to dynamically resolve the redirect URI
    # from the named Route. When oauth-proxy uses --openshift-service-account,
    # OCP auto-creates an OAuthClient (system:serviceaccount:grafana:grafana)
    # and derives redirectURIs from this annotation rather than requiring a
    # static hostname in the OAuthClient manifest.
    serviceaccounts.openshift.io/oauth-redirectreference.grafana: >
      {"kind":"OAuthRedirectReference","apiVersion":"v1",
       "metadata":{"creationTimestamp":null},
       "reference":{"kind":"Route","name":"grafana"}}
