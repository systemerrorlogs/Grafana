apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: secrets
type: Opaque
# IMPORTANT: This file contains PLACEHOLDER values only.
# NEVER commit real credentials to version control.
#
# Generate real values before applying:
#   GF_SECURITY_ADMIN_PASSWORD : openssl rand -base64 32
#   OAUTH_COOKIE_SECRET        : python3 -c "import os,base64; print(base64.b64encode(os.urandom(24)).decode())"
#                                Must base64-decode to exactly 16, 24, or 32 bytes for AES.
#   OAUTH_CLIENT_SECRET        : openssl rand -hex 32
#                                Only required when using the explicit OAuthClient manifest
#                                (oauthclient.yaml). Not needed for SA token mode.
#
# Recommended secret management approaches:
#   Development  : oc create secret generic grafana-secrets --from-literal=... (manual, not stored in git)
#   Production   : Use ExternalSecrets operator, Vault Agent injector, or OCP Secrets Store CSI driver.
#                  Replace this manifest with an ExternalSecret CR referencing your vault.
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  OAUTH_COOKIE_SECRET: "REPLACE_WITH_COOKIE_SECRET"
  OAUTH_CLIENT_SECRET: "REPLACE_WITH_OAUTH_CLIENT_SECRET"
