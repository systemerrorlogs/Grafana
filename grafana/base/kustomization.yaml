apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
- namespace.yaml
- serviceaccount.yaml
- rbac/scc-rolebinding.yaml
- rbac/auth-delegator-crb.yaml
- configmaps/grafana-config.yaml
- secrets/grafana-secrets.yaml
# oauthclient.yaml: uncomment ONLY if using explicit OAuthClient mode instead of
# SA token mode (--openshift-service-account). See comments in that file.
# - oauthclient.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- route.yaml

commonLabels:
  app.kubernetes.io/part-of: grafana
  app.kubernetes.io/managed-by: kustomize
